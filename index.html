<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lobster Roll Party Kits | Happy Lobster Chicago</title>
  <meta name="description" content="Order Lobster Roll Party Kits for delivery in Chicagoland. Fresh Maine lobster, buttery brioche buns, all the fixings. Feeds 8-32+.">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500;600;700&family=Hammersmith+One&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#fff;font-family:'Cormorant',Georgia,serif;color:#1B2A4A}
    input,textarea,select,button{font-family:inherit}
    input[type="date"]{font-family:'Cormorant',Georgia,serif}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef}=React;




const KITS=[
  {id:"small",name:"Small Party",feeds:8,price:208,perPerson:26,desc:"Perfect for an intimate gathering. 8 lobster rolls with all the fixings."},
  {id:"crowd",name:"Crowd Favorite",feeds:16,price:384,perPerson:24,desc:"Our most popular kit. 16 rolls — ideal for backyard parties and game days."},
  {id:"starter",name:"Party Starter",feeds:24,price:528,perPerson:22,desc:"Feeding a crew. 24 rolls for birthdays, block parties, or just because."},
  {id:"big",name:"Go Big",feeds:32,price:640,perPerson:20,desc:"Go all out. 32 rolls, maximum impact, best per-person price."},
];

const COMMISSARY={lat:41.8498,lng:-87.6593};
function getMinDate(){const d=new Date();d.setDate(d.getDate()+1);d.setHours(0,0,0,0);return d}
function fmtDateInput(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

function App(){
  const[step,setStep]=useState(0);
  const[cart,setCart]=useState({});
  const[deliveryDate,setDeliveryDate]=useState("");
  const[address,setAddress]=useState("");
  const[city,setCity]=useState("");
  const[state,setState]=useState("IL");
  const[zip,setZip]=useState("");
  const[distResult,setDistResult]=useState(null);
  const[distLoading,setDistLoading]=useState(false);
  const[distError,setDistError]=useState("");
  const[name,setName]=useState("");
  const[email,setEmail]=useState("");
  const[phone,setPhone]=useState("");
  const[notes,setNotes]=useState("");
  const[error,setError]=useState("");
  const[submitting,setSubmitting]=useState(false);
  const[checkoutUrl,setCheckoutUrl]=useState(null);
  const containerRef=useRef(null);

  const minDate=getMinDate();
  const minDateStr=fmtDateInput(minDate);
  const cartItems=Object.entries(cart).filter(([,q])=>q>0).map(([id,qty])=>({...KITS.find(k=>k.id===id),quantity:qty}));
  const subtotal=cartItems.reduce((s,i)=>s+i.price*i.quantity,0);
  const totalFeeds=cartItems.reduce((s,i)=>s+i.feeds*i.quantity,0);
  const deliveryFee=distResult&&distResult.fee!==null?distResult.fee:0;
  const preTax=subtotal+deliveryFee;
  const tax=Math.round(preTax*10.25)/100;
  const total=+(preTax+tax).toFixed(2);
  const cartEmpty=cartItems.length===0;

  function setQty(id,q){setCart(prev=>({...prev,[id]:Math.max(0,Math.min(10,q))}))}

  async function calcDistance(){
    if(!address.trim()||!city.trim()||!zip.trim())return;
    setDistLoading(true);setDistError("");setDistResult(null);
    const fullAddr=address.trim()+", "+city.trim()+", "+state+" "+zip.trim();
    try{
      const r=await fetch("/api/calc-distance",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({address:fullAddr})});
      const data=await r.json();
      if(data.error){setDistError(data.error)}else{setDistResult(data)}
    }catch(e){setDistError("Couldn't calculate distance. Check your address.")}
    finally{setDistLoading(false)}
  }

  function goNext(){
    setError("");
    if(step===0){if(cartEmpty){setError("Add at least one kit to your order.");return}setStep(1)}
    else if(step===1){
      if(!deliveryDate||new Date(deliveryDate+"T00:00:00")<minDate){setError("Pick a delivery date at least 24 hours from now.");return}
      if(new Date(deliveryDate+"T00:00:00").getDay()===0){setError("Sorry, we don't deliver on Sundays. Please pick another day.");return}
      if(!address.trim()||!city.trim()||!zip.trim()){setError("Enter your full delivery address.");return}
      if(!distResult){setError("Click 'Calculate Delivery Fee' to check your delivery distance.");return}
      if(distResult.fee===null){setError("Sorry, we can't deliver beyond 50 miles. Contact us for options.");return}
      setStep(2)
    }else if(step===2){
      if(!name.trim()){setError("Name is required.");return}
      if(!email.trim()||!email.includes("@")){setError("Valid email is required.");return}
      if(!phone.trim()){setError("Phone number is required.");return}
      handleSubmit()
    }
  }
  function goBack(){setError("");if(step>0)setStep(step-1)}

  async function handleSubmit(){
    setSubmitting(true);setError("");
    const chosenDate=new Date(deliveryDate+"T12:00:00");
    const dateStr=chosenDate.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
    const fullAddr=address+", "+city+", "+state+" "+zip;
    const orderNote=["PARTY KIT ORDER",...cartItems.map(i=>i.name+" x"+i.quantity+" ($"+(i.price*i.quantity)+")"),"Delivery: $"+deliveryFee+" ("+distResult.label+", "+distResult.miles+" mi driving)","Tax (10.25%): $"+tax.toFixed(2),"Total: $"+total.toFixed(2),"Date: "+dateStr,"Customer: "+name+" | "+phone+" | "+email,"Address: "+fullAddr,notes?"Notes: "+notes:""].filter(Boolean).join(" | ");
    try{
      const resp=await fetch("/api/create-checkout",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({items:cartItems.map(i=>({name:i.name,feeds:i.feeds,price:i.price,quantity:i.quantity})),deliveryFee,deliveryTierLabel:distResult.label+" — "+distResult.miles+" mi",dateStr,orderNote,email,phone,totalWithTax:total})});
      const data=await resp.json();
      if(data.url){setCheckoutUrl(data.url);setStep(3)}
      else{setError("Couldn't create checkout. "+(data.details?data.details[0].detail:"Please try again."))}
    }catch(e){console.error(e);setError("Something went wrong. Please try again or call us.")}
    finally{setSubmitting(false)}
  }

  useEffect(()=>{
    if(containerRef.current){
      containerRef.current.scrollTo({top:0});
      const sendResize=()=>{
        const h=document.getElementById('root').scrollHeight;
        window.parent.postMessage({type:'pk-resize',height:h+40},'*');
      };
      sendResize();
      setTimeout(sendResize,100);
      setTimeout(sendResize,300);
      setTimeout(()=>{
        window.parent.postMessage({type:'pk-scroll-top'},'*');
      },350);
    }
  },[step]);
  useEffect(()=>{
    const resizeObs=new ResizeObserver(()=>{
      const h=document.getElementById('root').scrollHeight;
      window.parent.postMessage({type:'pk-resize',height:h+40},'*');
    });
    resizeObs.observe(document.getElementById('root'));
    return ()=>resizeObs.disconnect();
  },[]);

  // ── STYLES matching Webflow Menu Types template ──
  const C={
    navy:"#1B2A4A",
    coral:"#E8716A",
    cream:"#F5F0DC",
    lightGray:"#f7f7f7",
    borderGray:"#e0e0e0",
    textMuted:"#6b7280",
  };

  const stepLabels=["Choose Your Kits","Delivery","Your Info","Checkout"];

  // Shared order summary component
  function OrderSummary({showDate,showAddr}){
    return(
      <div style={{background:C.lightGray,borderRadius:12,padding:"20px 24px",marginTop:20}}>
        {cartItems.map(i=>(
          <div key={i.id} style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
            <span style={{fontSize:16,color:C.navy}}>{i.name}{i.quantity>1?" × "+i.quantity:""}</span>
            <span style={{fontSize:16,fontWeight:600,color:C.navy}}>${i.price*i.quantity}</span>
          </div>
        ))}
        {distResult&&distResult.fee!==null&&(
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
            <span style={{fontSize:16,color:C.navy}}>Delivery ({distResult.label})</span>
            <span style={{fontSize:16,fontWeight:600,color:C.navy}}>${deliveryFee}</span>
          </div>
        )}
        {distResult&&distResult.fee!==null&&(
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
            <span style={{fontSize:15,color:C.textMuted}}>Tax (10.25%)</span>
            <span style={{fontSize:15,color:C.textMuted}}>${tax.toFixed(2)}</span>
          </div>
        )}
        <div style={{borderTop:"1px solid "+C.borderGray,paddingTop:10,display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
          <span style={{fontFamily:"'Hammersmith One',sans-serif",fontSize:18,color:C.navy,textTransform:"uppercase",letterSpacing:"0.05em"}}>Total</span>
          <span style={{fontSize:22,fontWeight:700,color:C.navy}}>${distResult&&distResult.fee!==null?total.toFixed(2):subtotal}</span>
        </div>
        {showDate&&deliveryDate&&(
          <div style={{fontSize:15,color:C.coral,fontWeight:600,marginTop:8}}>
            Delivery: {new Date(deliveryDate+"T12:00:00").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}
          </div>
        )}
        {showAddr&&address&&(
          <div style={{fontSize:14,color:C.textMuted,marginTop:4}}>{address}, {city}, {state} {zip}</div>
        )}
      </div>
    );
  }

  // Input style
  const inputStyle={width:"100%",padding:"14px 16px",borderRadius:10,border:"1px solid "+C.borderGray,background:"#fff",fontSize:16,color:C.navy,outline:"none"};

  return(
    <div ref={containerRef} style={{background:"#fff",overflowY:"auto"}}>



      {/* ── PROGRESS ── */}
      <div style={{maxWidth:560,margin:"0 auto",padding:"20px 24px 0"}}>
        <div style={{display:"flex",gap:6}}>
          {stepLabels.map((l,i)=>(
            <div key={l} style={{flex:1,textAlign:"center"}}>
              <div style={{height:3,borderRadius:2,background:i<=step?C.coral:C.borderGray,transition:"background 0.3s",marginBottom:6}}/>
              <span style={{fontSize:11,letterSpacing:"0.08em",textTransform:"uppercase",color:i<=step?C.navy:C.textMuted,fontWeight:i===step?700:400,fontFamily:"'Hammersmith One',sans-serif"}}>{l}</span>
            </div>
          ))}
        </div>
      </div>

      <div style={{maxWidth:560,margin:"0 auto",padding:"24px 24px 40px"}}>

        {/* ══════ STEP 0: Choose Kits ══════ */}
        {step===0&&(
          <div>
            <h2 style={{fontFamily:"'Hammersmith One',sans-serif",fontSize:22,color:C.navy,textTransform:"uppercase",letterSpacing:"0.04em",margin:"0 0 12px"}}>Choose Your Kits</h2>
            <div style={{height:3,background:C.coral,borderRadius:2,margin:"0 0 16px",width:60}}/>
            

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
              {KITS.map(k=>{
                const qty=cart[k.id]||0;
                return(
                  <div key={k.id} style={{border:qty>0?"2px solid "+C.coral:"1px solid "+C.borderGray,borderRadius:12,padding:"20px",background:"#fff",transition:"all 0.2s",display:"flex",flexDirection:"column",justifyContent:"space-between"}}>
                    <div>
                      <div style={{fontFamily:"'Hammersmith One',sans-serif",fontSize:13,color:C.textMuted,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:4}}>Feeds {k.feeds}</div>
                      <div style={{fontFamily:"'Hammersmith One',sans-serif",fontSize:16,color:C.navy,textTransform:"uppercase",letterSpacing:"0.04em",marginBottom:6}}>{k.name}</div>
                      <p style={{fontSize:14,color:C.textMuted,lineHeight:1.5,margin:"0 0 12px"}}>{k.desc}</p>
                    </div>
                    <div>
                      <div style={{fontSize:24,fontWeight:700,color:qty>0?C.coral:C.navy,marginBottom:4}}>${k.price}</div>
                      <div style={{fontSize:12,color:C.textMuted,marginBottom:10}}>${k.perPerson}/person</div>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <button onClick={()=>setQty(k.id,qty-1)} style={{width:32,height:32,borderRadius:"50%",border:"1px solid "+C.borderGray,background:"#fff",cursor:"pointer",fontSize:16,fontWeight:700,color:C.navy}}>−</button>
                        <span style={{fontSize:18,fontWeight:700,color:C.navy,minWidth:24,textAlign:"center"}}>{qty}</span>
                        <button onClick={()=>setQty(k.id,qty+1)} style={{width:32,height:32,borderRadius:"50%",border:"1px solid "+C.borderGray,background:"#fff",cursor:"pointer",fontSize:16,fontWeight:700,color:C.navy}}>+</button>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>

            {!cartEmpty&&(
              <OrderSummary showDate={false} showAddr={false}/>
            )}
          </div>
        )}

        {/* ══════ STEP 1: Delivery ══════ */}
        {step===1&&(
          <div>
            <h2 style={{fontFamily:"'Hammersmith One',sans-serif",fontSize:28,color:C.navy,textTransform:"uppercase",letterSpacing:"0.04em",margin:"0 0 4px"}}>Delivery Details</h2>
            <div style={{height:3,background:C.coral,borderRadius:2,margin:"0 0 8px",width:80}}/>
            <p style={{fontSize:15,color:C.textMuted,margin:"0 0 24px"}}>24-hour advance notice required. Chicagoland area only.</p>

            <label style={{fontFamily:"'Hammersmith One',sans-serif",fontSize:12,color:C.navy,letterSpacing:"0.1em",textTransform:"uppercase",display:"block",marginBottom:6}}>Delivery Date</label>
            <input type="date" value={deliveryDate} min={minDateStr} onChange={e=>{setDeliveryDate(e.target.value);if(new Date(e.target.value+"T00:00:00").getDay()===0)setError("Sorry, we don't deliver on Sundays.");else setError("")}} style={inputStyle}/>
            <p style={{fontSize:12,color:C.textMuted,marginTop:4,marginBottom:16}}>No Sunday deliveries</p>

            <label style={{fontFamily:"'Hammersmith One',sans-serif",fontSize:12,color:C.navy,letterSpacing:"0.1em",textTransform:"uppercase",display:"block",marginBottom:6}}>Street Address</label>
            <input type="text" value={address}  onChange={e=>{setAddress(e.target.value);setDistResult(null)}} style={{...inputStyle,marginBottom:14}}/>

            <div style={{display:"flex",gap:10,marginBottom:14}}>
              <div style={{flex:2}}>
                <label style={{fontFamily:"'Hammersmith One',sans-serif",fontSize:12,color:C.navy,letterSpacing:"0.1em",textTransform:"uppercase",display:"block",marginBottom:6}}>City</label>
                <input value={city} onChange={e=>{setCity(e.target.value);setDistResult(null)}}  style={inputStyle}/>
              </div>
              <div style={{flex:0.7}}>
                <label style={{fontFamily:"'Hammersmith One',sans-serif",fontSize:12,color:C.navy,letterSpacing:"0.1em",textTransform:"uppercase",display:"block",marginBottom:6}}>State</label>
                <input value={state} onChange={e=>setState(e.target.value)} style={inputStyle}/>
              </div>
              <div style={{flex:1}}>
                <label style={{fontFamily:"'Hammersmith One',sans-serif",fontSize:12,color:C.navy,letterSpacing:"0.1em",textTransform:"uppercase",display:"block",marginBottom:6}}>Zip</label>
                <input value={zip} onChange={e=>{setZip(e.target.value);setDistResult(null)}}  maxLength={5} style={inputStyle}/>
              </div>
            </div>

            <button onClick={calcDistance} disabled={distLoading||!address.trim()||!city.trim()||!zip.trim()} style={{width:"100%",padding:"14px",borderRadius:25,border:"none",background:distLoading?"#ccc":C.coral,cursor:distLoading?"not-allowed":"pointer",fontSize:14,fontFamily:"'Hammersmith One',sans-serif",fontWeight:400,color:"#fff",letterSpacing:"0.08em",textTransform:"uppercase",transition:"background 0.2s"}}>
              {distLoading?"Calculating...":"Calculate Delivery Fee"}
            </button>

            {distError&&<p style={{fontSize:14,color:"#b91c1c",marginTop:8}}>{distError}</p>}

            {distResult&&(
              <div style={{marginTop:14,padding:"14px 18px",background:distResult.fee!==null?"#f0fdf4":"#fef2f2",borderRadius:10,border:distResult.fee!==null?"1px solid #bbf7d0":"1px solid #fecaca"}}>
                {distResult.resolvedAddress&&(
                  <div style={{fontSize:13,color:C.textMuted,marginBottom:8,paddingBottom:8,borderBottom:"1px solid "+(distResult.fee!==null?"#bbf7d0":"#fecaca")}}>
                    <span style={{fontFamily:"'Hammersmith One',sans-serif",fontSize:11,letterSpacing:"0.08em",textTransform:"uppercase",color:C.navy}}>Delivering to: </span>{distResult.resolvedAddress}
                  </div>
                )}
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div><span style={{fontSize:15,fontWeight:600,color:C.navy}}>{distResult.miles} miles</span><span style={{fontSize:13,color:C.textMuted}}> · {distResult.duration} drive</span></div>
                  <span style={{fontFamily:"'Hammersmith One',sans-serif",fontSize:14,fontWeight:400,color:distResult.fee!==null?C.navy:"#b91c1c",letterSpacing:"0.05em",textTransform:"uppercase"}}>{distResult.fee!==null?"+$"+distResult.fee:"Not Available"}</span>
                </div>
              </div>
            )}

            {deliveryDate&&distResult&&distResult.fee!==null&&(
              <OrderSummary showDate={true} showAddr={false}/>
            )}
          </div>
        )}

        {/* ══════ STEP 2: Contact ══════ */}
        {step===2&&(
          <div>
            <h2 style={{fontFamily:"'Hammersmith One',sans-serif",fontSize:28,color:C.navy,textTransform:"uppercase",letterSpacing:"0.04em",margin:"0 0 4px"}}>Your Info</h2>
            <div style={{height:3,background:C.coral,borderRadius:2,margin:"0 0 8px",width:80}}/>
            <p style={{fontSize:15,color:C.textMuted,margin:"0 0 24px"}}>We'll confirm your order and send delivery updates.</p>

            {[{l:"Full Name",v:name,s:setName,t:"text"},{l:"Email",v:email,s:setEmail,t:"email"},{l:"Phone",v:phone,s:setPhone,t:"tel"}].map(f=>(
              <div key={f.l} style={{marginBottom:14}}>
                <label style={{fontFamily:"'Hammersmith One',sans-serif",fontSize:12,color:C.navy,letterSpacing:"0.1em",textTransform:"uppercase",display:"block",marginBottom:6}}>{f.l}</label>
                <input type={f.t} value={f.v} onChange={e=>f.s(e.target.value)} style={inputStyle}/>
              </div>
            ))}
            <div style={{marginBottom:14}}>
              <label style={{fontFamily:"'Hammersmith One',sans-serif",fontSize:12,color:C.navy,letterSpacing:"0.1em",textTransform:"uppercase",display:"block",marginBottom:6}}>Special Instructions <span style={{fontWeight:400,color:C.textMuted,textTransform:"none",letterSpacing:0,fontFamily:"'Cormorant'"}}>(optional)</span></label>
              <textarea value={notes} onChange={e=>setNotes(e.target.value)} rows={2}  style={{...inputStyle,resize:"none"}}/>
            </div>

            <OrderSummary showDate={true} showAddr={true}/>
          </div>
        )}

        {/* ══════ STEP 3: Checkout ══════ */}
        {step===3&&(
          <div style={{textAlign:"center",padding:"10px 0"}}>
            <h2 style={{fontFamily:"'Hammersmith One',sans-serif",fontSize:28,color:C.navy,textTransform:"uppercase",letterSpacing:"0.04em",margin:"0 0 4px"}}>Order Ready</h2>
            <div style={{height:3,background:C.coral,borderRadius:2,margin:"0 auto 16px",width:80}}/>
            <p style={{fontSize:16,color:C.textMuted,margin:"0 0 20px",lineHeight:1.6}}>Click below to complete payment securely through Square.</p>

            <div style={{textAlign:"left"}}>
              <OrderSummary showDate={true} showAddr={true}/>
            </div>

            <a href={checkoutUrl} style={{display:"inline-block",marginTop:24,padding:"16px 48px",background:C.coral,color:"#fff",borderRadius:25,fontSize:14,fontFamily:"'Hammersmith One',sans-serif",fontWeight:400,letterSpacing:"0.08em",textTransform:"uppercase",textDecoration:"none",transition:"opacity 0.2s"}}>
              Order via Square
            </a>
            <p style={{fontSize:12,color:C.textMuted,marginTop:12}}>Secure checkout powered by Square</p>
          </div>
        )}

        {/* ── Error ── */}
        {error&&<div style={{marginTop:14,padding:"12px 16px",background:"#fef2f2",border:"1px solid #fecaca",borderRadius:10,fontSize:14,color:"#b91c1c",textAlign:"center"}}>{error}</div>}

        {/* ── Nav buttons ── */}
        {step<3&&(
          <div style={{display:"flex",gap:12,marginTop:24}}>
            {step>0&&<button onClick={goBack} disabled={submitting} style={{flex:1,padding:"14px",borderRadius:25,border:"1px solid "+C.borderGray,background:"#fff",cursor:"pointer",fontSize:14,fontFamily:"'Hammersmith One',sans-serif",fontWeight:400,color:C.navy,letterSpacing:"0.06em",textTransform:"uppercase"}}>← Back</button>}
            <button onClick={goNext} disabled={submitting} style={{flex:2,padding:"14px",borderRadius:25,border:"none",background:submitting?"#ccc":C.coral,cursor:submitting?"not-allowed":"pointer",fontSize:14,fontFamily:"'Hammersmith One',sans-serif",fontWeight:400,color:"#fff",letterSpacing:"0.08em",textTransform:"uppercase",transition:"background 0.2s"}}>
              {submitting?"Creating order...":step===2?"Checkout — $"+total.toFixed(2):"Continue →"}
            </button>
          </div>
        )}

        {/* ── Footer ── */}
        <div style={{textAlign:"center",marginTop:32,paddingTop:20,borderTop:"1px solid "+C.borderGray}}>
          <p style={{fontSize:14,color:C.textMuted,margin:0,lineHeight:1.6}}>Questions? Email us at hello@happylobsterchicago.com<br/>Delivery available in the Chicagoland area.</p>
        </div>
      </div>
    </div>
  );
}
const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
