    const KITS = [
      { id: "small", name: "Small Party", feeds: 8, price: 208, perPerson: 26 },
      { id: "crowd", name: "Crowd Favorite", feeds: 16, price: 384, perPerson: 24 },
      { id: "starter", name: "Party Starter", feeds: 24, price: 528, perPerson: 22 },
      { id: "big", name: "Go Big", feeds: 32, price: 640, perPerson: 20 },
    ];

    const COMMISSARY = { lat: 41.8498, lng: -87.6593 }; // 2300 S Throop St

    function getMinDate() {
      const d = new Date();
      d.setDate(d.getDate() + 1);
      d.setHours(0, 0, 0, 0);
      return d;
    }
    function fmtDateInput(d) {
      return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
    }
    function getDeliveryTier(miles) {
      if (miles <= 15) return { label: "Within 15 mi", fee: 20 };
      if (miles <= 30) return { label: "16–30 mi", fee: 30 };
      if (miles <= 50) return { label: "31–50 mi", fee: 40 };
      return { label: "50+ mi", fee: null };
    }

    function App() {
      const [step, setStep] = useState(0);
      const [cart, setCart] = useState({});
      const [deliveryDate, setDeliveryDate] = useState("");
      const [address, setAddress] = useState("");
      const [city, setCity] = useState("");
      const [zip, setZip] = useState("");
      const [distMiles, setDistMiles] = useState(null);
      const [distLoading, setDistLoading] = useState(false);
      const [distError, setDistError] = useState("");
      const [name, setName] = useState("");
      const [email, setEmail] = useState("");
      const [phone, setPhone] = useState("");
      const [notes, setNotes] = useState("");
      const [error, setError] = useState("");
      const [submitting, setSubmitting] = useState(false);
      const [checkoutUrl, setCheckoutUrl] = useState(null);
      const containerRef = useRef(null);
      const autocompleteRef = useRef(null);
      const addressInputRef = useRef(null);
      const mapsLoaded = useRef(false);

      const minDate = getMinDate();
      const minDateStr = fmtDateInput(minDate);

      // Cart helpers
      const cartItems = Object.entries(cart).filter(([,q]) => q > 0).map(([id, qty]) => ({ ...KITS.find(k=>k.id===id), quantity: qty }));
      const subtotal = cartItems.reduce((s, i) => s + i.price * i.quantity, 0);
      const totalFeeds = cartItems.reduce((s, i) => s + i.feeds * i.quantity, 0);
      const tier = distMiles !== null ? getDeliveryTier(distMiles) : null;
      const deliveryFee = tier && tier.fee !== null ? tier.fee : 0;
      const total = subtotal + deliveryFee;
      const cartEmpty = cartItems.length === 0;

      function setQty(id, q) {
        setCart(prev => ({ ...prev, [id]: Math.max(0, Math.min(10, q)) }));
      }

      // Load Google Maps
      useEffect(() => {
        if (mapsLoaded.current) return;
        mapsLoaded.current = true;
        const s = document.createElement("script");
        s.src = "https://maps.googleapis.com/maps/api/js?key=AIzaSyB85uRNYNGnbw0wH6Od404wyw6peWQxTV4&libraries=places";
        s.async = true;
        s.onload = () => {
          if (addressInputRef.current && window.google) {
            initAutocomplete();
          }
        };
        document.head.appendChild(s);
      }, []);

      function initAutocomplete() {
        if (!addressInputRef.current || !window.google) return;
        const ac = new window.google.maps.places.Autocomplete(addressInputRef.current, {
          componentRestrictions: { country: "us" },
          fields: ["formatted_address", "geometry", "address_components"],
          types: ["address"],
        });
        ac.addListener("place_changed", () => {
          const place = ac.getPlace();
          if (place && place.geometry) {
            // Extract city and zip from components
            const comps = place.address_components || [];
            const cityComp = comps.find(c => c.types.includes("locality"));
            const zipComp = comps.find(c => c.types.includes("postal_code"));
            if (cityComp) setCity(cityComp.long_name);
            if (zipComp) setZip(zipComp.long_name);
            setAddress(place.formatted_address || addressInputRef.current.value);
            calcDistance(place.geometry.location.lat(), place.geometry.location.lng());
          }
        });
        autocompleteRef.current = ac;
      }

      // Initialize autocomplete when step changes to 1
      useEffect(() => {
        if (step === 1) {
          setTimeout(() => {
            if (addressInputRef.current && window.google && !autocompleteRef.current) {
              initAutocomplete();
            }
          }, 100);
        }
      }, [step]);

      function calcDistance(lat, lng) {
        setDistLoading(true);
        setDistError("");
        setDistMiles(null);
        const service = new window.google.maps.DistanceMatrixService();
        service.getDistanceMatrix({
          origins: [{ lat: COMMISSARY.lat, lng: COMMISSARY.lng }],
          destinations: [{ lat, lng }],
          travelMode: "DRIVING",
          unitSystem: window.google.maps.UnitSystem.IMPERIAL,
        }, (response, status) => {
          setDistLoading(false);
          if (status === "OK" && response.rows[0].elements[0].status === "OK") {
            const distText = response.rows[0].elements[0].distance.text;
            const miles = parseFloat(distText.replace(/,/g, ""));
            setDistMiles(Math.round(miles));
          } else {
            setDistError("Couldn't calculate distance. Please check the address.");
          }
        });
      }

      function goNext() {
        setError("");
        if (step === 0) {
          if (cartEmpty) { setError("Add at least one kit to your order."); return; }
          setStep(1);
        } else if (step === 1) {
          if (!deliveryDate || new Date(deliveryDate + "T00:00:00") < minDate) { setError("Pick a delivery date at least 24 hours from now."); return; }
          if (!address.trim()) { setError("Enter your delivery address."); return; }
          if (distMiles === null) { setError("Please select an address from the dropdown so we can calculate delivery distance."); return; }
          if (tier && tier.fee === null) { setError("Sorry, we can't deliver beyond 50 miles. Please contact us for options."); return; }
          setStep(2);
        } else if (step === 2) {
          if (!name.trim()) { setError("Name is required."); return; }
          if (!email.trim() || !email.includes("@")) { setError("Valid email is required."); return; }
          if (!phone.trim()) { setError("Phone number is required."); return; }
          handleSubmit();
        }
      }
      function goBack() { setError(""); if (step > 0) setStep(step - 1); }

      async function handleSubmit() {
        setSubmitting(true);
        setError("");
        const chosenDate = new Date(deliveryDate + "T12:00:00");
        const dateStr = chosenDate.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });

        const orderNote = [
          "PARTY KIT ORDER",
          ...cartItems.map(i => i.name + " x" + i.quantity + " ($" + (i.price * i.quantity) + ")"),
          "Delivery: $" + deliveryFee + " (" + tier.label + ", " + distMiles + " mi)",
          "Total: $" + total,
          "Date: " + dateStr,
          "Customer: " + name + " | " + phone + " | " + email,
          "Address: " + address,
          notes ? "Notes: " + notes : "",
        ].filter(Boolean).join(" | ");

        try {
          const resp = await fetch("/api/create-checkout", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              items: cartItems.map(i => ({ name: i.name, feeds: i.feeds, price: i.price, quantity: i.quantity })),
              deliveryFee,
              deliveryTierLabel: tier.label + " — " + distMiles + " mi",
              dateStr,
              orderNote,
              email,
              phone,
            }),
          });
          const data = await resp.json();
          if (data.url) {
            setCheckoutUrl(data.url);
            setStep(3);
          } else {
            setError("Couldn't create checkout. " + (data.details ? data.details[0].detail : "Please try again."));
          }
        } catch (err) {
          console.error(err);
          setError("Something went wrong. Please try again or call us.");
        } finally {
          setSubmitting(false);
        }
      }

      useEffect(() => { if (containerRef.current) containerRef.current.scrollTo({ top: 0, behavior: "smooth" }); }, [step]);

      const stepLabels = ["Build Kit", "Delivery", "Your Info", "Checkout"];
      const S = {
        page: { minHeight: "100vh", background: "#F5F0DC", fontFamily: "'Cormorant', Georgia, serif", color: "#333", overflowY: "auto" },
        header: { background: "#2D3561", padding: "24px 20px 20px", textAlign: "center" },
        logo: { height: 80, maxWidth: "80%", objectFit: "contain", marginBottom: 14, display: "block", marginLeft: "auto", marginRight: "auto" },
        h1: { color: "#F5F0DC", fontFamily: "'Hammersmith One', sans-serif", fontWeight: 400, fontSize: 26, margin: "0 0 4px", letterSpacing: "0.04em", textTransform: "uppercase" },
        sub: { color: "#E8716A", fontFamily: "'Cormorant', Georgia, serif", fontSize: 15, margin: 0, fontStyle: "italic", fontWeight: 500 },
        content: { maxWidth: 480, margin: "0 auto", padding: "12px 20px 32px" },
        label: { fontSize: 14, fontWeight: 600, color: "#2D3561", display: "block", marginBottom: 6 },
        input: { width: "100%", padding: "12px 14px", borderRadius: 8, border: "2px solid #d4cfc0", background: "#fff", fontFamily: "'Cormorant', Georgia, serif", fontSize: 15, color: "#333", boxSizing: "border-box" },
        card: { padding: 14, background: "#fff", borderRadius: 8, border: "1px solid #d4cfc0", marginTop: 16 },
        btnPrimary: (disabled) => ({ flex: 2, padding: "14px 0", borderRadius: 8, border: "none", background: disabled ? "#999" : "#2D3561", cursor: disabled ? "not-allowed" : "pointer", fontFamily: "'Cormorant', Georgia, serif", fontSize: 16, fontWeight: 700, color: "#F5F0DC", boxShadow: "0 2px 8px rgba(45,53,97,0.2)" }),
        btnBack: { flex: 1, padding: "14px 0", borderRadius: 8, border: "2px solid #d4cfc0", background: "#FAF7EE", cursor: "pointer", fontFamily: "'Cormorant', Georgia, serif", fontSize: 16, fontWeight: 600, color: "#555" },
        err: { marginTop: 12, padding: "10px 14px", background: "#fef2f2", border: "1px solid #E8716A", borderRadius: 8, fontSize: 14, color: "#b91c1c", textAlign: "center" },
        h2: { fontSize: 22, fontFamily: "'Hammersmith One', sans-serif", color: "#2D3561", margin: "0 0 4px", textAlign: "center" },
      };

      return (
        <div ref={containerRef} style={S.page}>
          {/* Header */}
          <div style={S.header}>
            <img src={LOGO_IMG} alt="Happy Lobster Chicago" style={S.logo} />
            <h1 style={S.h1}>Lobster Roll Party Kits</h1>
            <p style={S.sub}>Hosting just got a lot more interesting.</p>
          </div>

          {/* Progress */}
          <div style={{ display: "flex", justifyContent: "center", gap: 4, padding: "16px 20px 8px" }}>
            {stepLabels.map((l, i) => (
              <div key={l} style={{ textAlign: "center", flex: 1, maxWidth: 90 }}>
                <div style={{ height: 4, borderRadius: 2, background: i <= step ? "#E8716A" : "#d4cfc0", transition: "background 0.3s", marginBottom: 4 }} />
                <span style={{ fontSize: 11, color: i <= step ? "#2D3561" : "#999", fontWeight: i === step ? 700 : 400 }}>{l}</span>
              </div>
            ))}
          </div>

          <div style={S.content}>
            {/* STEP 0: Build your kit order */}
            {step === 0 && (
              <div>
                <p style={{ fontSize: 16, lineHeight: 1.6, color: "#555", margin: "0 0 16px", textAlign: "center" }}>
                  Fresh Maine lobster, buttery brioche buns, and all the fixings. Mix and match — order as many as you need.
                </p>
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  {KITS.map(k => {
                    const qty = cart[k.id] || 0;
                    return (
                      <div key={k.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "14px 16px", border: qty > 0 ? "2px solid #E8716A" : "2px solid #d4cfc0", borderRadius: 10, background: qty > 0 ? "#fff" : "#FAF7EE", transition: "all 0.2s", boxShadow: qty > 0 ? "0 2px 12px rgba(232,113,106,0.15)" : "none" }}>
                        <div>
                          <div style={{ fontSize: 17, fontWeight: 700, color: "#2D3561", marginBottom: 2 }}>{k.name}</div>
                          <div style={{ fontSize: 13, color: "#777" }}>Feeds {k.feeds} · ${k.perPerson}/person</div>
                        </div>
                        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                          <span style={{ fontSize: 20, fontWeight: 700, color: qty > 0 ? "#E8716A" : "#2D3561", minWidth: 50, textAlign: "right" }}>${k.price}</span>
                          <div style={{ display: "flex", alignItems: "center", gap: 6, marginLeft: 8 }}>
                            <button onClick={() => setQty(k.id, qty - 1)} style={{ width: 30, height: 30, borderRadius: "50%", border: "2px solid #d4cfc0", background: "#FAF7EE", cursor: "pointer", fontSize: 16, fontWeight: 700, color: "#2D3561", fontFamily: "'Cormorant'" }}>−</button>
                            <span style={{ fontSize: 18, fontWeight: 700, color: "#2D3561", minWidth: 20, textAlign: "center" }}>{qty}</span>
                            <button onClick={() => setQty(k.id, qty + 1)} style={{ width: 30, height: 30, borderRadius: "50%", border: "2px solid #d4cfc0", background: "#FAF7EE", cursor: "pointer", fontSize: 16, fontWeight: 700, color: "#2D3561", fontFamily: "'Cormorant'" }}>+</button>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
                {!cartEmpty && (
                  <div style={S.card}>
                    {cartItems.map(i => (
                      <div key={i.id} style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                        <span style={{ fontSize: 15, color: "#555" }}>{i.name}{i.quantity > 1 ? " × " + i.quantity : ""}</span>
                        <span style={{ fontSize: 15, color: "#2D3561", fontWeight: 600 }}>${i.price * i.quantity}</span>
                      </div>
                    ))}
                    <div style={{ borderTop: "1px solid #d4cfc0", paddingTop: 6, marginTop: 4, display: "flex", justifyContent: "space-between" }}>
                      <span style={{ fontSize: 16, fontWeight: 700, color: "#2D3561" }}>Subtotal · Feeds {totalFeeds}</span>
                      <span style={{ fontSize: 16, fontWeight: 700, color: "#2D3561" }}>${subtotal}</span>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* STEP 1: Delivery */}
            {step === 1 && (
              <div>
                <h2 style={S.h2}>Delivery Details</h2>
                <p style={{ fontSize: 14, color: "#777", margin: "0 0 16px", textAlign: "center" }}>24-hour advance notice required. Chicagoland area only.</p>

                <label style={S.label}>Delivery Date</label>
                <input type="date" value={deliveryDate} min={minDateStr} onChange={e => setDeliveryDate(e.target.value)} style={S.input} />

                <label style={{ ...S.label, marginTop: 16 }}>Delivery Address</label>
                <input ref={addressInputRef} type="text" placeholder="Start typing your address..." defaultValue={address} style={S.input} />

                {distLoading && <p style={{ fontSize: 14, color: "#777", marginTop: 8 }}>Calculating delivery distance...</p>}
                {distError && <p style={{ fontSize: 14, color: "#b91c1c", marginTop: 8 }}>{distError}</p>}

                {distMiles !== null && (
                  <div style={{ marginTop: 12, padding: "12px 16px", background: tier.fee !== null ? "#f0f7f0" : "#fef2f2", borderRadius: 8, border: tier.fee !== null ? "1px solid #c3dcc3" : "1px solid #E8716A" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <span style={{ fontSize: 15, color: "#2D3561", fontWeight: 600 }}>{distMiles} miles from our kitchen</span>
                      <span style={{ fontSize: 16, fontWeight: 700, color: tier.fee !== null ? "#2D3561" : "#b91c1c" }}>
                        {tier.fee !== null ? "+$" + tier.fee + " delivery" : "Not available"}
                      </span>
                    </div>
                  </div>
                )}

                {deliveryDate && distMiles !== null && tier && tier.fee !== null && (
                  <div style={S.card}>
                    {cartItems.map(i => (
                      <div key={i.id} style={{ display: "flex", justifyContent: "space-between", marginBottom: 2 }}>
                        <span style={{ fontSize: 15, color: "#555" }}>{i.name}{i.quantity > 1 ? " × " + i.quantity : ""}</span>
                        <span style={{ fontSize: 15, color: "#2D3561", fontWeight: 600 }}>${i.price * i.quantity}</span>
                      </div>
                    ))}
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                      <span style={{ fontSize: 15, color: "#555" }}>Delivery ({tier.label})</span>
                      <span style={{ fontSize: 15, color: "#2D3561", fontWeight: 600 }}>${deliveryFee}</span>
                    </div>
                    <div style={{ borderTop: "1px solid #d4cfc0", paddingTop: 6, display: "flex", justifyContent: "space-between" }}>
                      <span style={{ fontSize: 18, fontWeight: 700, color: "#2D3561" }}>Total</span>
                      <span style={{ fontSize: 18, fontWeight: 700, color: "#2D3561" }}>${total}</span>
                    </div>
                    <div style={{ fontSize: 15, color: "#E8716A", fontWeight: 600, marginTop: 6 }}>
                      Delivery: {new Date(deliveryDate + "T12:00:00").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" })}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* STEP 2: Contact */}
            {step === 2 && (
              <div>
                <h2 style={S.h2}>Almost there!</h2>
                <p style={{ fontSize: 14, color: "#777", margin: "0 0 16px", textAlign: "center" }}>We'll confirm your order and send delivery updates.</p>
                {[
                  { l: "Full Name", v: name, s: setName, t: "text" },
                  { l: "Email", v: email, s: setEmail, t: "email" },
                  { l: "Phone", v: phone, s: setPhone, t: "tel" },
                ].map(f => (
                  <div key={f.l} style={{ marginBottom: 12 }}>
                    <label style={{ ...S.label, marginBottom: 4 }}>{f.l}</label>
                    <input type={f.t} value={f.v} onChange={e => f.s(e.target.value)} style={S.input} />
                  </div>
                ))}
                <div style={{ marginBottom: 12 }}>
                  <label style={{ ...S.label, marginBottom: 4 }}>Special Instructions <span style={{ fontWeight: 400, color: "#999" }}>(optional)</span></label>
                  <textarea value={notes} onChange={e => setNotes(e.target.value)} rows={2} placeholder="Gate code, delivery window, etc." style={{ ...S.input, resize: "none" }} />
                </div>
                <div style={S.card}>
                  {cartItems.map(i => (
                    <div key={i.id} style={{ display: "flex", justifyContent: "space-between", marginBottom: 2 }}>
                      <span style={{ fontSize: 15, color: "#555" }}>{i.name}{i.quantity > 1 ? " × " + i.quantity : ""}</span>
                      <span style={{ fontSize: 15, color: "#2D3561", fontWeight: 600 }}>${i.price * i.quantity}</span>
                    </div>
                  ))}
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                    <span style={{ fontSize: 15, color: "#555" }}>Delivery ({tier.label})</span>
                    <span style={{ fontSize: 15, color: "#2D3561", fontWeight: 600 }}>${deliveryFee}</span>
                  </div>
                  <div style={{ borderTop: "1px solid #d4cfc0", paddingTop: 6, display: "flex", justifyContent: "space-between" }}>
                    <span style={{ fontSize: 18, fontWeight: 700, color: "#2D3561" }}>Total</span>
                    <span style={{ fontSize: 18, fontWeight: 700, color: "#2D3561" }}>${total}</span>
                  </div>
                  <div style={{ fontSize: 14, color: "#E8716A", fontWeight: 600, marginTop: 6 }}>
                    Delivery: {new Date(deliveryDate + "T12:00:00").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" })}
                  </div>
                  <div style={{ fontSize: 13, color: "#777", marginTop: 4 }}>{address}</div>
                </div>
              </div>
            )}

            {/* STEP 3: Redirect to Square */}
            {step === 3 && (
              <div style={{ textAlign: "center", padding: "20px 0" }}>
                <div style={{ width: 64, height: 64, borderRadius: "50%", background: "#2D3561", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 16px", fontSize: 28 }}>🦞</div>
                <h2 style={{ ...S.h2, fontSize: 24, margin: "0 0 8px" }}>Order Ready!</h2>
                <p style={{ fontSize: 16, color: "#555", margin: "0 0 24px", lineHeight: 1.6 }}>
                  Click below to complete payment securely through Square.
                </p>
                <div style={{ ...S.card, marginBottom: 24, textAlign: "left" }}>
                  {cartItems.map(i => (
                    <div key={i.id} style={{ display: "flex", justifyContent: "space-between", marginBottom: 2 }}>
                      <span style={{ fontSize: 15, color: "#555" }}>{i.name}{i.quantity > 1 ? " × " + i.quantity : ""}</span>
                      <span style={{ fontSize: 15, color: "#2D3561", fontWeight: 600 }}>${i.price * i.quantity}</span>
                    </div>
                  ))}
                  <div style={{ fontSize: 14, color: "#555", marginBottom: 2 }}>Feeds {totalFeeds} people</div>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                    <span style={{ fontSize: 15, color: "#555" }}>Delivery ({tier.label})</span>
                    <span style={{ fontSize: 15, color: "#2D3561", fontWeight: 600 }}>${deliveryFee}</span>
                  </div>
                  <div style={{ borderTop: "1px solid #d4cfc0", paddingTop: 6, display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                    <span style={{ fontSize: 18, fontWeight: 700, color: "#2D3561" }}>Total</span>
                    <span style={{ fontSize: 18, fontWeight: 700, color: "#2D3561" }}>${total}</span>
                  </div>
                  <div style={{ fontSize: 14, color: "#E8716A", fontWeight: 600 }}>
                    Delivery: {new Date(deliveryDate + "T12:00:00").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" })}
                  </div>
                  <div style={{ fontSize: 13, color: "#777", marginTop: 4 }}>{address}</div>
                </div>
                <a href={checkoutUrl} style={{ display: "inline-block", padding: "16px 48px", background: "#E8716A", color: "#fff", borderRadius: 8, fontSize: 18, fontWeight: 700, fontFamily: "'Cormorant', Georgia, serif", textDecoration: "none", boxShadow: "0 4px 16px rgba(232,113,106,0.3)" }}>
                  Pay with Square →
                </a>
                <p style={{ fontSize: 12, color: "#999", marginTop: 16 }}>Secure checkout powered by Square</p>
              </div>
            )}

            {/* Error */}
            {error && <div style={S.err}>{error}</div>}

            {/* Nav */}
            {step < 3 && (
              <div style={{ display: "flex", gap: 10, marginTop: 20 }}>
                {step > 0 && <button onClick={goBack} disabled={submitting} style={S.btnBack}>← Back</button>}
                <button onClick={goNext} disabled={submitting} style={S.btnPrimary(submitting)}>
                  {submitting ? "Creating order..." : step === 2 ? "Checkout — $" + total : "Continue →"}
                </button>
              </div>
            )}

            <div style={{ textAlign: "center", marginTop: 28, paddingTop: 16, borderTop: "1px solid #d4cfc0" }}>
              <p style={{ fontSize: 13, color: "#999", margin: 0, lineHeight: 1.5 }}>
                Questions? Text or call us.<br />Delivery available in the Chicagoland area.
              </p>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
